repos:
  # Backend: Ruff (lint) + Black (format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: ruff (backend lint)
        args: [--fix]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: "26.5.1"
    hooks:
      - id: black
        name: black (backend format)
        files: ^backend/

  # Frontend: ESLint + Prettier (run via npm scripts so config/plugins stay in sync with package.json)
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend lint)
        entry: npm --prefix frontend run lint --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false

      - id: prettier
        name: prettier (frontend format check)
        entry: npm --prefix frontend run format:check --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|md|json)$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
